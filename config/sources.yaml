# Trusted crawl sources for SahulatAI's knowledge base.
# Add or remove URLs here. Only these domains will ever be crawled.
#
# source_type must be one of: official_website, official_pdf, secondary_source
# (challenge_document sources are added separately via scripts/ingest_documents.py)

allowed_domains:
  - saylaniwelfare.com
  - www.saylaniwelfare.com
  - old.saylaniwelfare.com
  - saylanimit.com
  - www.saylanimit.com

seed_urls:
  # --- Saylani Welfare (main site) — real current URLs as of Sep 2026.
  # Seeded across every major service category so the crawler's own link
  # discovery (depth 4 below) reaches the pages nested under each one —
  # blood bank, dastarkhwan, clinics, schooling, etc. — without us having
  # to guess every exact slug up front. ---
  - url: "https://saylaniwelfare.com/"
    source_type: official_website
  - url: "https://saylaniwelfare.com/about/saylani-introduction"
    source_type: official_website
  - url: "https://saylaniwelfare.com/services"
    source_type: official_website
  - url: "https://saylaniwelfare.com/services/education/technical-education/saylani-mass-it-training"
    source_type: official_website
  - url: "https://saylaniwelfare.com/contact-us"
    source_type: official_website
  - url: "https://saylaniwelfare.com/donate"
    source_type: official_website
  - url: "https://saylaniwelfare.com/bank-details"
    source_type: official_website
  - url: "https://saylaniwelfare.com/blogs"
    source_type: official_website
  - url: "https://saylaniwelfare.com/news"
    source_type: official_website
  - url: "https://saylaniwelfare.com/services/education/technical-education/piaic"
    source_type: official_website
  - url: "https://saylaniwelfare.com/Saylani-Clinic-Hospital"
    source_type: official_website
  # Legacy subdomain — still live and holds older program detail pages
  # (clinic/hospital, blood bank) not yet migrated to the current site.
  - url: "https://old.saylaniwelfare.com/"
    source_type: official_website

  # --- Saylani Mass IT Training (SMIT) — separate official domain that hosts
  # the actual courses/admission/enrollment content ---
  - url: "https://www.saylanimit.com/"
    source_type: official_website
  - url: "https://www.saylanimit.com/about"
    source_type: official_website
  - url: "https://www.saylanimit.com/courses"
    source_type: official_website
  - url: "https://www.saylanimit.com/enroll"
    source_type: official_website
  - url: "https://www.saylanimit.com/campuses"
    source_type: official_website
  - url: "https://www.saylanimit.com/contact"
    source_type: official_website
  - url: "https://www.saylanimit.com/chat"
    source_type: official_website

# Any additional official PDFs (prospectuses, program brochures, etc.)
official_pdfs: []

crawl:
  # Widened further: real link discovery from the seeds above reaches
  # program sub-pages (blood bank, dastarkhwan, individual SMIT courses,
  # blog posts) several links deep, and the combined site footprint across
  # both domains is well over 200 pages once blogs are included.
  max_depth: 4
  max_pages: 400
  respect_robots_txt: true
  timeout_seconds: 10
  user_agent: "SahulatAI-Bot/1.0 (+local hackathon project; contact: dev@example.com)"
